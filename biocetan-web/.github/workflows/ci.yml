name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Unit tests (contact form backend)
        run: npm test
      - name: Colour contrast (WCAG AA)
        run: npm run check:contrast
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build
